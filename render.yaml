services:
  # Backend: Go Gin Real-Time WebSocket Web Service
  - type: web
    name: pulsepoll-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # Set in Render dashboard (e.g. MongoDB Atlas)
      - key: MONGO_DB_NAME
        value: livepolling
      - key: REDIS_URL
        sync: false # Set in Render dashboard (e.g. Upstash Redis rediss://...)
      - key: CLIENT_URL
        sync: false # Set to frontend URL after deploy

  # Frontend: React Vite Static Site
  - type: web
    name: pulsepoll-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Point to pulsepoll-backend URL
